<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Атмосферный трекер</title>
    <style>
        body { font-family: sans-serif; background: #fff5eb; display: flex; justify-content: center; padding-top: 30px; transition: background 0.5s, color 0.5s; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 320px; }
        h1 { font-size: 20px; color: #ff8c42; text-align: center; margin-top: 0; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ffcc99; border-radius: 8px; outline: none; font-size: 14px; }
        .add-btn { background: #ff8c42; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        .add-btn:hover { background: #e0732f; }
        ul { list-style: none; padding: 0; margin: 0 0 20px 0; }
        li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
        .task-text { flex: 1; margin-left: 10px; font-size: 15px; word-break: break-word; }
        .completed { text-decoration: line-through; color: #aaa; }
        .del-btn { background: #ff4d4d; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; }
        
        .streak-info { text-align: center; font-weight: bold; font-size: 16px; color: #333; margin-bottom: 15px; background: #fff2e6; padding: 8px; border-radius: 8px; }
        .achievements { border-top: 2px dashed #ffcc99; padding-top: 15px; }
        .achievements h3 { font-size: 15px; color: #666; margin: 0 0 10px 0; text-align: center; }
        .badge-container { display: flex; justify-content: space-around; }
        .badge { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #888; font-weight: bold; text-align: center; width: 80px; }
        .badge-icon { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; background: #e0e0e0; filter: grayscale(1); margin-bottom: 5px; border: 2px solid #ccc; transition: all 0.3s; }
        .badge.active .badge-icon { filter: grayscale(0); background: white; border-color: #ff8c42; box-shadow: 0 4px 8px rgba(255,140,66,0.2); }
        .badge.active { color: #333; }
        
        body.night-theme { background: #2c2c2c !important; color: #ffffff; }
        body.night-theme .container { background: #3d3d3d; color: #ffffff; }
        body.night-theme h1 { color: #ffaa66; }
        body.night-theme .streak-info { background: #4a4a4a; color: #fff; }
        body.night-theme li { border-color: #4a4a4a; }
        body.night-theme .task-text { color: #fff; }
        body.night-theme .completed { color: #777; }
        body.night-theme input[type="text"] { background: #555; border-color: #666; color: #fff; }
        body.night-theme .achievements h3 { color: #bbb; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="mainTitle">Атмосферный трекер</h1>
        
        <div class="streak-info" id="streakDisplay">🔥 Серия постоянства: 0 дней</div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Новая привычка...">
            <button class="add-btn" onclick="addTask()">Добавить</button>
        </div>
        
        <ul id="taskList"></ul>

        <div class="achievements">
            <h3>Мои достижения</h3>
            <div class="badge-container">
                <div class="badge" id="badge3">
                    <div class="badge-icon">🥉</div>
                    Бронза (3 дн.)
                </div>
                <div class="badge" id="badge7">
                    <div class="badge-icon">🥈</div>
                    Серебро (7 дн.)
                </div>
                <div class="badge" id="badge21">
                    <div class="badge-icon">🥇</div>
                    Золото (21 дн.)
                </div>
            </div>
        </div>
    </div>

    <script>
        let habits = JSON.parse(localStorage.getItem('habits')) || [];
        let streak = parseInt(localStorage.getItem('habit_streak')) || 0;
        let lastCheckDate = localStorage.getItem('last_check_date') || "";

        function updateTimeTheme() {
            const hour = new Date().getHours();
            const body = document.body;
            
            body.classList.remove('night-theme');
            
            if (hour >= 6 && hour < 12) {
                body.style.backgroundColor = "#ffe6cc";
            } else if (hour >= 12 && hour < 18) {
                body.style.backgroundColor = "#fff5eb";
            } else if (hour >= 18 && hour < 24) {
                body.style.backgroundColor = "#ffcc99";
            } else {
                body.style.backgroundColor = "#2c2c2c";
                body.classList.add('night-theme');
            }
        }

        function checkStreakLogic() {
            if (lastCheckDate === "") return;
            const todayStr = new Date().toDateString();
            const lastDate = new Date(lastCheckDate);
            const today = new Date(todayStr);
            const diffTime = Math.abs(today - lastDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays > 1 && lastCheckDate !== todayStr) {
                streak = 0;
                localStorage.setItem('habit_streak', streak);
            }
        }

        function render() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            
            habits.forEach((habit, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <input type="checkbox" ${habit.done ? 'checked' : ''} onclick="toggleHabit(${index})">
                    <span class="task-text ${habit.done ? 'completed' : ''}">${habit.text}</span>
                    <button class="del-btn" onclick="deleteHabit(${index})">Х</button>
                `;
                list.appendChild(li);
            });

            document.getElementById('streakDisplay').innerText = `🔥 Серия постоянства: ${streak} дней`;
            document.getElementById('badge3').classList.toggle('active', streak >= 3);
            document.getElementById('badge7').classList.toggle('active', streak >= 7);
            document.getElementById('badge21').classList.toggle('active', streak >= 21);
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (input.value.trim() === '') return;
            habits.push({ text: input.value, done: false });
            input.value = '';
            saveAndRender();
        }

        function toggleHabit(index) {
            habits[index].done = !habits[index].done;
            checkAllTasksCompleted();
            saveAndRender();
        }

        function checkAllTasksCompleted() {
            if (habits.length === 0) return;
            const allDone = habits.every(h => h.done);
            const todayStr = new Date().toDateString();
            
            if (allDone && lastCheckDate !== todayStr) {
                streak++;
                lastCheckDate = todayStr;
                localStorage.setItem('habit_streak', streak);
                localStorage.setItem('last_check_date', lastCheckDate);
            }
        }

        function deleteHabit(index) {
            habits.splice(index, 1);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('habits', JSON.stringify(habits));
            render();
        }

        updateTimeTheme();
        setInterval(updateTimeTheme, 5000);
        checkStreakLogic();
        render();
    </script>
</body>
</html>
